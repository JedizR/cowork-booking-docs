        agreed_price_satang: 45000
        currency: THB
        coverage: pay
        hold_expires_at: '2026-10-05T10:15:00+07:00'
        payment_session_id: ps_Q7mZ3xK9vT2bN8rL4wYc1A
        payment_url: null
        payment_status: paid
        cancel_reason: member_cancel
        refund_reason: member_cancel
        refund_amount_satang: 45000
