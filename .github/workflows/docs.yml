name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check docs
        run: python scripts/check_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Render diagrams
        run: |
          shopt -s nullglob
          mkdir -p /tmp/render
          for f in diagrams/*.mmd; do
            echo "render $f"
            npx -y @mermaid-js/mermaid-cli@11 -p diagrams/puppeteer.json -i "$f" -o "/tmp/render/$(basename "${f%.mmd}").svg"
          done
